<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Gestionale Negozio{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="{{ url_for('static', filename='app.js') }}" defer></script></head>
<body><div class="app-shell">{% include 'header.html' %}<div class="main-content">
<header class="topbar"><div><h1 class="topbar-title">{% block heading %}{% endblock %}</h1><p class="topbar-subtitle">{% block subtitle %}{% endblock %}</p></div><div class="calendar-actions">{% block actions %}{% endblock %}</div></header>
<main class="page-content">{% for category, message in get_flashed_messages(with_categories=true) %}<div class="alert-custom alert-{{ category }}" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
{% include 'footer.html' %}</div></div></body></html>
